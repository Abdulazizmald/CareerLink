services:
  - type: web
    name: careerlink
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
